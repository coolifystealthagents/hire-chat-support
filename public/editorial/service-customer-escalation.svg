<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <title>Customer escalation coordination workflow</title>
  <desc>A sensitive request is flagged, its prior context is packaged, and an authorized owner accepts the next decision.</desc>
  <rect width="1600" height="1000" rx="42" fill="#F3EAF7"/>
  <circle cx="210" cy="850" r="190" fill="#D9EC65" opacity=".6"/>
  <rect x="64" y="64" width="1472" height="872" rx="34" fill="#FBF6EC" stroke="#D7C0EF" stroke-width="4"/>
  <text x="120" y="145" fill="#603487" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">ESCALATION COORDINATION</text>
  <text x="120" y="204" fill="#271A2E" font-family="Arial,sans-serif" font-size="44" font-weight="700">Keep the case owned at the boundary.</text>
  <rect x="120" y="302" width="340" height="470" rx="26" fill="#FFFDF8" stroke="#D7C0EF" stroke-width="3"/>
  <circle cx="180" cy="372" r="28" fill="#D9EC65"/><path d="M180 354v21M180 389v2" stroke="#603487" stroke-width="6" stroke-linecap="round"/>
  <text x="226" y="364" fill="#65596B" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="1">TRIGGER</text>
  <text x="160" y="454" fill="#271A2E" font-family="Arial,sans-serif" font-size="28" font-weight="700">Needs a</text>
  <text x="160" y="490" fill="#271A2E" font-family="Arial,sans-serif" font-size="28" font-weight="700">decision</text>
  <path d="M160 536h250M160 568h208M160 600h250" stroke="#C9BECF" stroke-width="9" stroke-linecap="round"/>
  <rect x="160" y="660" width="220" height="54" rx="27" fill="#F3EAF7"/>
  <text x="184" y="695" fill="#603487" font-family="Arial,sans-serif" font-size="18" font-weight="700">Pause and route</text>
  <path d="M480 538h76" stroke="#603487" stroke-width="8" stroke-linecap="round"/><path d="m534 514 25 24-25 24" stroke="#603487" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="580" y="302" width="444" height="470" rx="26" fill="#271A2E"/>
  <text x="624" y="366" fill="#D9EC65" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">CONTEXT PACKET</text>
  <rect x="624" y="410" width="356" height="90" rx="18" fill="#FBF6EC"/>
  <circle cx="660" cy="455" r="13" fill="#D7C0EF"/><path d="M688 442h254M688 470h198" stroke="#A89BAF" stroke-width="8" stroke-linecap="round"/>
  <rect x="624" y="518" width="356" height="90" rx="18" fill="#46364F"/>
  <circle cx="660" cy="563" r="13" fill="#D9EC65"/><path d="M688 550h220M688 578h170" stroke="#B6A9BD" stroke-width="8" stroke-linecap="round"/>
  <rect x="624" y="626" width="356" height="90" rx="18" fill="#46364F"/>
  <circle cx="660" cy="671" r="13" fill="#D7C0EF"/><path d="M688 658h246M688 686h180" stroke="#B6A9BD" stroke-width="8" stroke-linecap="round"/>
  <path d="M1044 538h76" stroke="#603487" stroke-width="8" stroke-linecap="round"/><path d="m1098 514 25 24-25 24" stroke="#603487" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1144" y="350" width="296" height="374" rx="26" fill="#D7C0EF"/>
  <circle cx="1292" cy="428" r="38" fill="#603487"/><path d="M1292 410v36M1274 428h36" stroke="#FFFDF8" stroke-width="5" stroke-linecap="round"/>
  <text x="1190" y="514" fill="#271A2E" font-family="Arial,sans-serif" font-size="24" font-weight="700">Authorized owner</text>
  <text x="1190" y="550" fill="#51465A" font-family="Arial,sans-serif" font-size="17">Decision authority stays</text>
  <text x="1190" y="578" fill="#51465A" font-family="Arial,sans-serif" font-size="17">with the right person.</text>
  <rect x="1190" y="624" width="206" height="52" rx="26" fill="#D9EC65"/>
  <text x="1216" y="658" fill="#271A2E" font-family="Arial,sans-serif" font-size="17" font-weight="700">Ownership accepted</text>
</svg>
